# Levanta todo el sistema: docker compose up --build
# Frontend: http://localhost:3000  ·  API: http://localhost:4000/api
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sistema_tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tickets_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Se ejecutan solo la primera vez (volumen vacío)
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d sistema_tickets"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: tickets
      DB_PASSWORD: ${DB_PASSWORD:-tickets_dev}
      DB_NAME: sistema_tickets
      # Para producción define un JWT_SECRET propio en un archivo .env junto a este compose
      JWT_SECRET: ${JWT_SECRET:-solo-para-demo-local-cambiar-en-produccion}
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
